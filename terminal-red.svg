<svg width="800" height="660" viewBox="0 0 800 660" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Siber Kızıl / Crimson Arka Plan Gradyanı -->
    <linearGradient id="bg-grad-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180709" />
      <stop offset="45%" stop-color="#0e0405" />
      <stop offset="100%" stop-color="#050202" />
    </linearGradient>

    <!-- CRT / Scanline Deseni -->
    <pattern id="scanlines-red" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.38" />
    </pattern>

    <!-- Avatar Yuvarlatma Maskesi -->
    <clipPath id="avatar-clip">
      <rect x="50" y="145" width="165" height="195" rx="14" />
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Courier, Consolas, monospace; }
    .term-title { fill: #71717a; font-size: 13px; font-weight: 500; }
    .prompt-user { fill: #f43f5e; font-size: 14px; font-weight: 700; }
    .prompt-sym { fill: #f43f5e; font-size: 14px; }
    .prompt-tilde { fill: #a1a1aa; font-size: 14px; }
    .prompt-cmd { fill: #ffffff; font-size: 14px; font-weight: 700; }
    .lbl { fill: #f43f5e; font-size: 13px; font-weight: 700; }
    .val { fill: #f4f4f5; font-size: 13px; }
    .val-dim { fill: #71717a; }
  </style>

  <!-- Dış Pencere Çerçevesi -->
  <rect x="1" y="1" width="798" height="658" rx="16" fill="url(#bg-grad-red)" stroke="#271115" stroke-width="1.5"/>
  <rect x="1" y="1" width="798" height="658" rx="16" fill="url(#scanlines-red)"/>

  <!-- macOS Üst Barı -->
  <line x1="1" y1="46" x2="799" y2="46" stroke="#271115" stroke-width="1"/>
  <circle cx="30" cy="24" r="6" fill="#ff5f56" />
  <circle cx="50" cy="24" r="6" fill="#ffbd2e" />
  <circle cx="70" cy="24" r="6" fill="#27c93f" />

  <!-- Üst Başlıklar -->
  <text x="400" y="28" text-anchor="middle" class="mono term-title">root@croxln: ~</text>
  <text x="765" y="28" text-anchor="end" class="mono term-title">github.com/croxln</text>

  <!-- 1. KOMUT: neofetch -->
  <text x="50" y="95" class="mono prompt-user">root@croxln</text>
  <text x="145" y="95" class="mono prompt-tilde"> ~ </text>
  <text x="170" y="95" class="mono prompt-sym"># </text>
  <text x="190" y="95" class="mono prompt-cmd">neofetch</text>

  <!-- Avatar Kutusu -->
  <rect x="49" y="144" width="167" height="197" rx="15" fill="none" stroke="#f43f5e" stroke-opacity="0.5" stroke-width="1.5" />
  <image href="https://github.com/croxln.png" x="50" y="145" width="165" height="195" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-clip)" />

  <!-- Neofetch Bilgileri -->
  <g transform="translate(245, 142)">
    <text x="0" y="18" class="mono prompt-user" font-size="16">root@croxln</text>
    <line x1="0" y1="26" x2="490" y2="26" stroke="#4c0519" stroke-width="1"/>

    <!-- Satırlar -->
    <text x="0" y="50" class="mono lbl">İsim</text>
    <text x="100" y="50" class="mono val">Serhat Görgeç</text>

    <text x="0" y="73" class="mono lbl">Rol</text>
    <text x="100" y="73" class="mono val">High-Performance MC Architect <tspan class="val-dim">•</tspan> Sistem Mimarı</text>

    <text x="0" y="96" class="mono lbl">Konum</text>
    <text x="100" y="96" class="mono val">İstanbul, Türkiye</text>

    <text x="0" y="119" class="mono lbl">Uzmanlık</text>
    <text x="100" y="119" class="mono val">Sunucu Altyapısı <tspan class="val-dim">•</tspan> Savaş Sistemleri <tspan class="val-dim">•</tspan> Otomasyon</text>

    <text x="0" y="142" class="mono lbl">Stack</text>
    <text x="100" y="142" class="mono val">Java 21 LTS <tspan class="val-dim">•</tspan> PaperMC <tspan class="val-dim">•</tspan> Leaf <tspan class="val-dim">•</tspan> Maven <tspan class="val-dim">•</tspan> SQLite <tspan class="val-dim">•</tspan> MySQL</text>

    <text x="0" y="165" class="mono lbl">Dil</text>
    <text x="100" y="165" class="mono val">Türkçe <tspan class="val-dim">•</tspan> English</text>

    <text x="0" y="188" class="mono lbl">Web</text>
    <text x="100" y="188" class="mono val" fill="#f43f5e">github.com/croxln</text>

    <!-- Renk Paleti Blokları -->
    <g transform="translate(0, 203)">
      <rect x="0" y="0" width="28" height="14" rx="3" fill="#2a060c" />
      <rect x="34" y="0" width="28" height="14" rx="3" fill="#4c0519" />
      <rect x="68" y="0" width="28" height="14" rx="3" fill="#881337" />
      <rect x="102" y="0" width="28" height="14" rx="3" fill="#be123c" />
      <rect x="136" y="0" width="28" height="14" rx="3" fill="#f43f5e" />
      <rect x="170" y="0" width="28" height="14" rx="3" fill="#ffe4e6" />
    </g>
  </g>

  <!-- 2. KOMUT: cat vizyon.txt -->
  <g transform="translate(50, 420)">
    <text x="0" y="0" class="mono prompt-user">root@croxln</text>
    <text x="95" y="0" class="mono prompt-tilde"> ~ </text>
    <text x="120" y="0" class="mono prompt-sym"># </text>
    <text x="140" y="0" class="mono prompt-cmd">cat vizyon.txt</text>

    <text x="0" y="28" class="mono val">Fikirden canlı ortama, uçtan uca yazılım geliştiriyorum.</text>
    <text x="0" y="50" class="mono val">Sağlam temeller, temiz kod ve uzun ömürlü ürünler.</text>
    <text x="0" y="72" class="mono val">Bir yapı ihtiyacı karşılamıyorsa yamamam; doğru temeller üzerine yeniden kurarım.</text>
  </g>

  <!-- 3. KOMUT: open https://github.com/croxln -->
  <g transform="translate(50, 545)">
    <text x="0" y="0" class="mono prompt-user">root@croxln</text>
    <text x="95" y="0" class="mono prompt-tilde"> ~ </text>
    <text x="120" y="0" class="mono prompt-sym"># </text>
    <text x="140" y="0" class="mono prompt-cmd">open https://github.com/croxln</text>

    <text x="0" y="26" class="mono val-dim">→ github.com/croxln açılıyor. Yeni projeler için bir mesaj uzağınızdayım.</text>
  </g>

  <!-- Aktif Cursor -->
  <g transform="translate(50, 615)">
    <text x="0" y="0" class="mono prompt-user">root@croxln</text>
    <text x="95" y="0" class="mono prompt-tilde"> ~ </text>
    <text x="120" y="0" class="mono prompt-sym"># </text>
    <rect x="142" y="-12" width="9" height="16" fill="#f43f5e" />
  </g>
</svg>
