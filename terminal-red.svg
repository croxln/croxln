<svg width="800" height="660" viewBox="0 0 800 660" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Siber Kızıl / Crimson Arka Plan Gradyanı -->
    <linearGradient id="bg-grad-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#180709" />
      <stop offset="45%" stop-color="#0e0405" />
      <stop offset="100%" stop-color="#050202" />
    </linearGradient>

    <!-- CRT / Scanline Deseni -->
    <pattern id="scanlines-red" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.4" />
    </pattern>

    <!-- Avatar Yuvarlatma Maskesi -->
    <clipPath id="avatar-clip">
      <rect x="50" y="140" width="165" height="185" rx="14" />
    </clipPath>
  </defs>

  <style>
    .mono { font-family: 'Courier New', Courier, Consolas, monospace; }
    .term-title { fill: #71717a; font-size: 13px; font-weight: 500; }
    .prompt-user { fill: #f43f5e; font-size: 14px; font-weight: 700; }
    .prompt-sym { fill: #f43f5e; font-size: 14px; }
    .prompt-tilde { fill: #a1a1aa; font-size: 14px; }
    .prompt-cmd { fill: #ffffff; font-size: 14px; font-weight: 700; }
    .lbl { fill: #f43f5e; font-size: 13px; font-weight: 700; }
    .val { fill: #f4f4f5; font-size: 13px; }
    .val-dim { fill: #71717a; }
    .val-green { fill: #22c55e; font-weight: 600; }
  </style>

  <!-- Dış Pencere Çerçevesi -->
  <rect x="1" y="1" width="798" height="658" rx="16" fill="url(#bg-grad-red)" stroke="#2c1015" stroke-width="1.5"/>
  <rect x="1" y="1" width="798" height="658" rx="16" fill="url(#scanlines-red)"/>

  <!-- macOS Üst Barı -->
  <line x1="1" y1="46" x2="799" y2="46" stroke="#2c1015" stroke-width="1"/>
  <circle cx="30" cy="24" r="6" fill="#ff5f56" />
  <circle cx="50" cy="24" r="6" fill="#ffbd2e" />
  <circle cx="70" cy="24" r="6" fill="#27c93f" />

  <!-- Üst Başlıklar -->
  <text x="400" y="28" text-anchor="middle" class="mono term-title">root@croxln: ~ (PaperMC / Folia Core)</text>
  <text x="765" y="28" text-anchor="end" class="mono term-title">SafirMC • Kalradya</text>

  <!-- 1. KOMUT: neofetch -->
  <text x="50" y="92" class="mono prompt-user">root@croxln</text>
  <text x="145" y="92" class="mono prompt-tilde"> ~ </text>
  <text x="170" y="92" class="mono prompt-sym"># </text>
  <text x="190" y="92" class="mono prompt-cmd">neofetch --arch</text>

  <!-- Avatar Kutusu -->
  <rect x="49" y="139" width="167" height="187" rx="15" fill="none" stroke="#f43f5e" stroke-opacity="0.6" stroke-width="1.5" />
  <image href="https://github.com/croxln.png" x="50" y="140" width="165" height="185" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-clip)" />

  <!-- Neofetch Bilgileri -->
  <g transform="translate(245, 140)">
    <text x="0" y="16" class="mono prompt-user" font-size="16">root@croxln</text>
    <line x1="0" y1="26" x2="490" y2="26" stroke="#4c0519" stroke-width="1"/>

    <!-- Satırlar -->
    <text x="0" y="50" class="mono lbl">Rol</text>
    <text x="95" y="50" class="mono val">High-Performance MC Architect <tspan class="val-dim">•</tspan> Sistem Mühendisi</text>

    <text x="0" y="74" class="mono lbl">Uzmanlık</text>
    <text x="95" y="74" class="mono val">Folia Eşzamanlılık <tspan class="val-dim">•</tspan> Siege Motorları <tspan class="val-dim">•</tspan> Async Core</text>

    <text x="0" y="98" class="mono lbl">Çekirdek</text>
    <text x="95" y="98" class="mono val">Java 25/21 LTS <tspan class="val-dim">•</tspan> PaperMC <tspan class="val-dim">•</tspan> Folia <tspan class="val-dim">•</tspan> HikariCP</text>

    <text x="0" y="122" class="mono lbl">Mimariler</text>
    <text x="95" y="122" class="mono val">O(1) Spatial Chunks <tspan class="val-dim">•</tspan> Packet Injection <tspan class="val-dim">•</tspan> Async Tasks</text>

    <text x="0" y="146" class="mono lbl">Suit</text>
    <text x="95" y="146" class="mono val">SrTowny <tspan class="val-dim">•</tspan> SrTownyFactory <tspan class="val-dim">•</tspan> SrOrder</text>

    <text x="0" y="170" class="mono lbl">Durum</text>
    <text x="95" y="170" class="mono val-green">🟢 20.00 TPS <tspan class="val-dim">•</tspan> 1.85ms MSPT <tspan class="val-dim">•</tspan> Sıfır Darboğaz</text>

    <!-- Renk Paleti Blokları (Kızıl / Crimson Tonları) -->
    <g transform="translate(0, 185)">
      <rect x="0" y="0" width="28" height="14" rx="3" fill="#2a060c" />
      <rect x="34" y="0" width="28" height="14" rx="3" fill="#4c0519" />
      <rect x="68" y="0" width="28" height="14" rx="3" fill="#881337" />
      <rect x="102" y="0" width="28" height="14" rx="3" fill="#be123c" />
      <rect x="136" y="0" width="28" height="14" rx="3" fill="#f43f5e" />
      <rect x="170" y="0" width="28" height="14" rx="3" fill="#ffe4e6" />
    </g>
  </g>

  <!-- 2. KOMUT: cat felsefe.txt -->
  <g transform="translate(50, 415)">
    <text x="0" y="0" class="mono prompt-user">root@croxln</text>
    <text x="95" y="0" class="mono prompt-tilde"> ~ </text>
    <text x="120" y="0" class="mono prompt-sym"># </text>
    <text x="140" y="0" class="mono prompt-cmd">cat felsefe.txt</text>

    <text x="0" y="28" class="mono val">20.00 TPS ve stabil MSPT tesadüf değildir; ödünsüz sistem mühendisliğidir.</text>
    <text x="0" y="50" class="mono val">Sunucu lag'ine yama yapmam; darboğazı kökünden çözen asenkron mimariler kurarım.</text>
    <text x="0" y="72" class="mono val">Binlerce oyuncu, devasa kuşatmalar ve sıfır gecikme: Doğru temeller her şeydir.</text>
  </g>

  <!-- 3. KOMUT: open https://github.com/croxln -->
  <g transform="translate(50, 545)">
    <text x="0" y="0" class="mono prompt-user">root@croxln</text>
    <text x="95" y="0" class="mono prompt-tilde"> ~ </text>
    <text x="120" y="0" class="mono prompt-sym"># </text>
    <text x="140" y="0" class="mono prompt-cmd">open https://github.com/croxln</text>

    <text x="0" y="26" class="mono val-dim">→ Çekirdek mimariler devrede. Yüksek ölçekli sistemler için bir mesaj uzağınızdayım.</text>
  </g>

  <!-- Aktif Cursor -->
  <g transform="translate(50, 615)">
    <text x="0" y="0" class="mono prompt-user">root@croxln</text>
    <text x="95" y="0" class="mono prompt-tilde"> ~ </text>
    <text x="120" y="0" class="mono prompt-sym"># </text>
    <rect x="142" y="-12" width="9" height="16" fill="#f43f5e" />
  </g>
</svg>
