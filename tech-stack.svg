      <g transform="translate(11, 8)">
        <path d="M0 18L18 0H0V18ZM18 18L9 9L0 18H18ZM18 18L9 9L18 0V18Z" fill="url(#kotlin-grad)"/>
      </g>
      <text x="36" y="22" class="pill-text">Kotlin</text>
    </g>

    <!-- JavaScript -->
    <g transform="translate(204, 0)">
      <rect width="120" height="34" class="pill-rect"/>
      <g transform="translate(11, 8)">
        <rect width="18" height="18" rx="3" fill="#f7df1e"/>
        <path d="M11.6 14.6c.7 0 1.3-.4 1.3-1.1 0-.8-.5-1-1.3-1.4l-.4-.2c-1.1-.5-1.9-.9-1.9-2.1 0-1.2.9-2 2.3-2 1 0 1.7.3 2.2.8l-.8 1c-.4-.4-.8-.6-1.4-.6-.6 0-1 .3-1 .8 0 .6.4.8 1.2 1.2l.4.2c1.3.6 2 1.1 2 2.3 0 1.4-1.1 2.2-2.6 2.2-1.3 0-2.2-.4-2.7-1.1l.9-1c.4.6 1 1 1.9 1zm-5.7.9c-1.1 0-1.8-.4-2.2-1.1l1-.8c.3.4.6.7 1.2.7.5 0 .9-.3.9-.9v-5.6h1.3v5.6c0 1.4-.8 2.1-2.2 2.1z" fill="#000000"/>
      </g>
      <text x="36" y="22" class="pill-text">JavaScript</text>
    </g>
  </g>

