<svg width="800" height="290" viewBox="0 0 800 290" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Siber Kızıl / Crimson Arka Plan -->
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#160608"/>
      <stop offset="45%" stop-color="#0e0405"/>
      <stop offset="100%" stop-color="#050202"/>
    </linearGradient>

    <!-- Üst Kenar Crimson/Rose Parıltı Gradyanı -->
    <linearGradient id="top-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.95"/>
      <stop offset="35%" stop-color="#f43f5e" stop-opacity="0.9"/>
      <stop offset="70%" stop-color="#fb7185" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9f1239" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Pill Arka Plan -->
    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#220c10"/>
      <stop offset="100%" stop-color="#140608"/>
    </linearGradient>

    <!-- Kotlin Degrade -->
    <linearGradient id="kotlin-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0095D5"/>
      <stop offset="50%" stop-color="#806EE3"/>
      <stop offset="100%" stop-color="#C757BC"/>
    </linearGradient>

    <!-- Scanline Deseni (Terminal Kartı ile Bütünlük İçin) -->
    <pattern id="card-scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.32" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 16px;
      font-weight: 700;
      fill: #ffffff;
      letter-spacing: -0.2px;
    }
    .cat-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #a1a1aa;
      letter-spacing: 1.5px;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13px;
      font-weight: 500;
      fill: #f4f4f5;
    }
    .pill-rect {
      fill: url(#pill-bg);
      stroke: #331116;
      stroke-width: 1;
      rx: 8px;
    }
  </style>

  <!-- Dış Pencere Gövdesi -->
  <rect x="1" y="1" width="798" height="288" rx="16" fill="url(#card-bg)" stroke="#270e13" stroke-width="1.5"/>
  <rect x="1" y="1" width="798" height="288" rx="16" fill="url(#card-scanlines)"/>

  <!-- Üst Kenar Gradyan Çizgisi -->
  <path d="M 16 1 L 784 1" stroke="url(#top-accent)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Kart Başlığı -->
  <text x="36" y="38" class="title">Technology Stack</text>

  <!-- ==================== 1. LANGUAGES ==================== -->
  <text x="36" y="89" class="cat-label">LANGUAGES</text>
  <g transform="translate(160, 68)">
    <!-- Java -->
    <g transform="translate(0, 0)">
      <rect width="88" height="34" class="pill-rect"/>
      <g transform="translate(11, 8)">
        <path d="M7.7 13.6c-2.4-.1-4.7-.6-4.7-.6s1.6.4 3.7.5c2.4.1 4.9 0 6.6-.4 0 0-1.8.6-5.6.5zm-1.8-2.5c-2.8-.1-5.4-.7-5.4-.7s1.8.5 4.3.6c2.7.2 5.6.1 7.5-.4 0 0-2 .6-6.4.5zm8.9 5.3c-.8.6-2.2 1.1-4.3 1.2-3.1.2-7.2-.3-9.5-1.5 0 0 1.2.7 3.9 1 3.5.4 8.7.3 10.9-1.2 0 0-.4.3-1 .5zm-4.3-8.8c.8 1.1.2 2.2-.8 3.2 1.3-.3 2.5-.9 2.5-1.8 0-1.5-1.7-2.1-1.7-3.4 0-1.3 1.2-2.1 1.2-2.1s-1.8.8-1.8 2.3c0 1.2.6 1.8.6 1.8zm2.7-3.9c.7.9.3 1.9-.6 2.8 1.1-.3 2.1-.8 2.1-1.6 0-1.3-1.5-1.8-1.5-3 0-1.1 1.1-1.8 1.1-1.8s-1.6.7-1.6 2c0 1 .5 1.6.5 1.6z" fill="#f89820"/>
        <path d="M12.9 14.5c.9-.7.9-1.3.9-1.3s-.2.3-.9.6c-1.3.5-3.8.7-6.2.6-2.9-.2-5.7-.8-5.7-.8s1.6.5 4.1.7c3.1.3 6.9.1 7.8-.8z" fill="#5382a1"/>
      </g>
      <text x="36" y="22" class="pill-text">Java</text>
    </g>

    <!-- Kotlin -->
    <g transform="translate(98, 0)">
