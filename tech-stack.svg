<svg xmlns="http://www.w3.org/2000/svg" width="800" height="296" viewBox="0 0 800 296" role="img" aria-label="Technology Stack">
  <defs>
    <!-- Siber Kızıl Üst Parıltı Gradyanı -->
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E11D48"/>
      <stop offset=".4" stop-color="#F43F5E"/>
      <stop offset=".8" stop-color="#FB7185"/>
      <stop offset="1" stop-color="#9F1239" stop-opacity="0.3"/>
    </linearGradient>

    <!-- Scanline Deseni -->
    <pattern id="card-scanlines" width="100" height="4" patternUnits="userSpaceOnUse">
      <line x1="0" y1="0" x2="100" y2="0" stroke="#000000" stroke-width="1.2" opacity="0.25" />
    </pattern>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 18px;
      font-weight: 700;
      fill: #FFFFFF;
      letter-spacing: -0.2px;
    }
    .cat-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #A1A1AA;
      letter-spacing: 1.5px;
    }
    .chip-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 13.5px;
      font-weight: 500;
      fill: #E8EEF5;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-size: 9.5px;
      font-weight: 800;
      text-anchor: middle;
    }
  </style>

  <!-- Ana Kart Gövdesi -->
  <rect x=".5" y=".5" width="799" height="295" rx="14" fill="#100406" stroke="#2e0d12"/>
  <rect x=".5" y=".5" width="799" height="295" rx="14" fill="url(#card-scanlines)"/>

  <!-- Üst Kenar Gradyan Çizgisi -->
  <rect x="24" y="0" width="752" height="1.8" fill="url(#edge)" rx="0.9"/>

  <!-- Kart Başlığı -->
  <text x="24" y="39" class="title">Technology Stack</text>

